<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Creator's Event Pass</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f0ece8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      padding: 32px 16px;
    }

    .card {
      width: 360px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.18), 0 4px 16px rgba(0,0,0,0.10);
      background: #fff;
      position: relative;
    }

    /* TOP HALF */
    .card-top {
      position: relative;
      width: 100%;
      height: 320px;
      background: #f5ede6;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
    }
    .blob-1 {
      width: 310px; height: 310px;
      background: radial-gradient(circle at 40% 40%, #f97b3c 0%, #f96b2f 55%, transparent 80%);
      bottom: -60px; left: -60px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform: rotate(-15deg);
      opacity: 0.95;
    }
    .blob-2 {
      width: 220px; height: 220px;
      background: radial-gradient(circle, #f5a98a 0%, #f97b3c 60%, transparent 85%);
      top: -40px; right: -40px;
      opacity: 0.75;
      border-radius: 50% 70% 50% 60% / 50% 50% 70% 60%;
    }
    .blob-3 {
      width: 180px; height: 180px;
      background: radial-gradient(circle, #fbd5c2 0%, #f9a07a 60%, transparent 90%);
      top: 30px; left: 20px;
      opacity: 0.55;
      border-radius: 60% 40% 60% 40% / 40% 60% 40% 60%;
    }
    .blob-4 {
      width: 140px; height: 140px;
      background: radial-gradient(circle, #fce8dc 0%, #f9b898 70%, transparent 95%);
      bottom: 20px; right: 20px;
      opacity: 0.5;
      border-radius: 50%;
    }

    /* Logo */
    .logo {
      position: absolute;
      top: 12px; left: 12px;
      width: 58px; height: 58px;
      z-index: 10;
      background: transparent;
    }
    .logo img {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    /* Photo placeholder */
    .photo-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 180px;
      height: 200px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    }
    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #d0d0d0 0%, #b0b0b0 100%);
      gap: 10px;
      color: #888;
    }
    .photo-placeholder svg {
      width: 64px; height: 64px;
      opacity: 0.55;
    }
    .user-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-placeholder span {
      font-size: 11px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    /* BOTTOM INFO */
    .card-bottom {
      background: #ffffff;
      padding: 28px 28px 0 28px;
      text-align: center;
    }

    .attending-text {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.01em;
      margin-bottom: 10px;
      font-style: italic;
    }

    .attendee-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #f97b3c;
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }

    .name-divider {
      width: 100%;
      height: 2px;
      background: #7ab648;
      border-radius: 2px;
      margin-bottom: 18px;
    }

    .event-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #f97b3c;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .event-date {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: #1a1a1a;
      letter-spacing: 0.22em;
      margin-bottom: 22px;
    }

    .barcode-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 0;
    }

    .barcode {
      width: 220px;
      height: 52px;
      margin-bottom: 6px;
    }

    .barcode-id {
      font-family: 'Space Mono', monospace;
      font-size: 10.5px;
      color: #1a1a1a;
      letter-spacing: 0.06em;
      margin-bottom: 18px;
    }

    /* FOOTER PATTERN STRIP */
    .pattern-strip {
      width: 100%;
      height: 62px;
      overflow: hidden;
      display: block;
      line-height: 0;
    }
    .pattern-strip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
  </style>
</head>
